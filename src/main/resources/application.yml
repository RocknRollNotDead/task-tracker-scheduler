server:
  port: 8091

spring:
  application:
    name: sheduler
  datasource:
    url: jdbc:postgresql://${LOCALHOST:mydb}:5432/task_db
    username: ${DB_LOGIN}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 1

  jpa:
    show_sql: false
    hibernate:
      ddl-auto: validate

kafka:
  url: ${LOCALHOST:kafka}:9092
  group-id: scheduler-group
  consumer-name: scheduler-consumer
  producer-name: scheduler-producer

schedule:
  cron: 0 26 20 * * *
  zone: Europe/Moscow
